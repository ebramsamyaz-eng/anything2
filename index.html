<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Message for you</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating hearts -->
    <div class="hearts"></div>

    <!-- Main question -->
    <main class="container" id="questionScreen">

        <img src="images/bear.png" class="bear" alt="Cute Bear">

        <h1>Do you upset with me?</h1>

        <p class="counter">
            Attempts to press No: <span id="counter">0</span> 😂
        </p>

        <div class="buttons">

            <button id="yesBtn">
                Yes 
            </button>

            <button id="noBtn">
                No 
            </button>

        </div>

    </main>

    <!-- Final screen -->
    <main class="ending" id="endingScreen">

        <img src="images/hug.png" class="hug-image" alt="Cute Bears Hugging">

        <h1>I knew it 😂</h1>

        <p class="love-text">
            You couldn't escape me 😂
        </p>

    </main>

    <!-- Confetti container -->
    <div id="confetti"></div>

    <script src="script.js"></script>

</body>

</html>
